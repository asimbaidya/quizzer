# Local development stack for Quizzer.
#
# Per project convention, ONLY Postgres runs in Docker. Bring it up with:
#
#     docker compose up -d
#
# then run the backend and frontend natively (see README). Values are read from
# the root .env file (copy .env.example -> .env first).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-quizzer}
    volumes:
      - quizzer-db-data:/var/lib/postgresql/data
      # Creates the separate <db>_test database used by the pytest suite.
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quizzer}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  quizzer-db-data:
